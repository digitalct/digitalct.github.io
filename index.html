<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CT</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #1a1a1a;
      font-family: "Times New Roman", Times, serif;
      font-size: 12pt;
      line-height: 1.4;
      margin: 0;
      padding: 20px;
    }

    .main-container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-radius: 6px;
    }

    /* Header Styling */
    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-header h1 {
      font-size: 18pt;
      font-weight: bold;
      margin: 0 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-header p {
      margin: 0 0 3px 0;
    }

    /* Tab Navigation Bar */
    .tab-navigation {
      display: flex;
      border-bottom: 2px solid #ddd;
      margin-bottom: 20px;
    }

    .tab-button {
      background-color: transparent;
      border: none;
      outline: none;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 11pt;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      color: #555555;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background-color: #f1f1f1;
    }

    /* Individual Custom Colors for Active Tabs */
    .tab-button[data-tab="Overview"].active {
      color: #1b365d; /* Navy Blue */
      border-bottom: 3px solid #1b365d;
      background-color: #f0f4f8;
    }

    .tab-button[data-tab="Technical"].active {
      color: #006666; /* Teal / Dark Cyan */
      border-bottom: 3px solid #006666;
      background-color: #e6f2f2;
    }

    .tab-button[data-tab="Experience"].active {
      color: #8b0000; /* Dark Red / Crimson */
      border-bottom: 3px solid #8b0000;
      background-color: #f9ebeb;
    }

    .tab-button[data-tab="Work"].active {
      color: #4b0082; /* Indigo / Dark Purple */
      border-bottom: 3px solid #4b0082;
      background-color: #f3eafa;
    }

    /* Tab Content Styling */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Section Styling */
    .section-title {
      font-size: 13pt;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 10px;
      margin-bottom: 8px;
      padding-bottom: 2px;
      border-bottom: 1px solid #ccc;
    }

    ul {
      margin: 0 0 16px 0;
      padding-left: 20px;
    }

    li {
      margin-bottom: 6px;
    }

    a {
      color: #0000ee;
      text-decoration: underline;
    }

    a:visited {
      color: #551a8b;
    }

    /* Experience Table */
    .experience-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    .experience-table td {
      padding: 6px 0;
      vertical-align: top;
      font-size: 12pt;
      border-bottom: 1px solid #f0f0f0;
    }

    .experience-table .role {
      text-align: left;
    }

    .experience-table .year {
      text-align: right;
      white-space: nowrap;
      padding-left: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="main-container">

    <div class="profile-header">
      <h1>T. CHENGAPPA</h1>
      <p><b>Senior Technical Superintendent</b></p>
      <p>Department of Physics | Indian Institute of Technology Hyderabad</p>
      <p><b>E-mail:</b> <a href="mailto:chengappa.thumisi@phy.iith.ac.in">chengappa.thumisi@phy.iith.ac.in</a></p>
    </div>

    
</body>
</html>
