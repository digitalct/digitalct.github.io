<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-container {
      text-align: center;
    }

    h1 {
      color: #6b21a8; /* Deep elegant purple */
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin: 0;
      padding-bottom: 12px;
    }

    /* Subtle elegant underline accent */
    .underline {
      width: 40px;
      height: 2px;
      background-color: #a855f7;
      margin: 0 auto;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Chengappa Thumisi</h1>
    <div class="underline"></div>
  </div>

</body>
</html>
